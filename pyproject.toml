[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medidor-de-deformaciones"
version = "0.3.0"
description = "Multilingual real-time strain measurement for MCP3008 and Raspberry Pi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["adafruit-blinka", "adafruit-circuitpython-mcp3xxx", "matplotlib", "reportlab"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
medidor-de-deformaciones = "medidor.app:main"
medidor-medicion = "medidor.cli:main"
medidor-web = "medidor.web:main"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
